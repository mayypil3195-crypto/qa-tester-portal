<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Submission</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-wrap">
    <div class="card">
      <header class="card-header">
        <h1 class="card-title">QA Submission</h1>
        <p class="card-subtitle">Submit your testing report for points verification</p>
      </header>

      <div id="alertBanner" class="alert-banner" role="alert" style="display: none;"></div>

      <form id="submissionForm" class="submission-form" novalidate>
        <div class="form-group">
          <label for="username" class="form-label">Discord Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="form-input" 
            placeholder="username" 
            required 
            autocomplete="off"
          >
        </div>

        <div class="form-group">
          <label for="discord_id" class="form-label">Discord User ID</label>
          <input 
            type="text" 
            id="discord_id" 
            name="discord_id" 
            class="form-input" 
            placeholder="18-digit ID" 
            pattern="[0-9]{17,20}" 
            required 
            autocomplete="off"
          >
        </div>

        <div class="form-group">
          <label for="points" class="form-label">Points Requested</label>
          <input 
            type="number" 
            id="points" 
            name="points" 
            class="form-input" 
            min="1" 
            max="1000" 
            value="10" 
            required
          >
        </div>

        <div class="form-group">
          <label for="description" class="form-label">Report Details</label>
          <textarea 
            id="description" 
            name="description" 
            class="form-textarea" 
            placeholder="Describe the bugs found or testing done..." 
            rows="4" 
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label for="proof_url" class="form-label">Proof Link <span class="optional-label">(optional)</span></label>
          <input 
            type="url" 
            id="proof_url" 
            name="proof_url" 
            class="form-input" 
            placeholder="https://..." 
            autocomplete="off"
          >
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          <span id="btnText">Submit</span>
        </button>
      </form>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
